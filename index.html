// flatten for search
const allItems = [];
for (const [topKey, top] of Object.entries(DATA)) {
    for (const cat of top.categories) {
        for (const child of cat.children) {
            for (const item of child.items) {
                allItems.push({ ...item, topKey, topName: top.title, catName: cat.name, childName: child.name });
            }
        }
    }
}

// ── Top Nav ──
const topNav = document.getElementById("topNav");
const topMeta = {};
let firstTopTitle = null;
for (const [k, v] of Object.entries(DATA)) {
    const n = v.categories.reduce((s, c) => s + c.children.reduce((s2, ch) => s2 + ch.items.length, 0), 0);
    topMeta[v.title] = { key: k, count: n };
    const iconMap = {"文件资料":"📁","影视音漫":"🎬","教程课程":"🎓","游戏资源":"🎮","素材杂烩":"📦"};
    const isFirst = firstTopTitle === null;
    const btn = document.createElement("button");
    btn.className = "top-btn" + (isFirst ? " active" : "");
    btn.innerHTML = `${iconMap[v.title]||"📦"} ${v.title}`;
    btn.dataset.top = v.title;
    topNav.appendChild(btn);
    if (isFirst) firstTopTitle = v.title;
}

topNav.addEventListener("click", e => {
    const btn = e.target.closest(".top-btn");
    if (!btn || !btn.dataset.top) return;    // 「首页」外链不参与分类切换
    topNav.querySelectorAll(".top-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    renderSubNav(btn.dataset.top);
    render(btn.dataset.top, currentSub);
});

// ── Sub Nav ──
let currentSub = "all";
function renderSubNav(topId) {
    currentSub = "all";
    const subNav = document.getElementById("subNav");
    subNav.innerHTML = "";
    if (topId === "all") { subNav.style.display = "none"; return; }
    subNav.style.display = "";
    const top = DATA[topMeta[topId].key];
    const allBtn = document.createElement("button");
    allBtn.className = "sub-btn active";
    allBtn.innerHTML = `全部 <span class="badge">${topMeta[topId].count}</span>`;
    allBtn.dataset.sub = "all";
    subNav.appendChild(allBtn);
    for (const cat of top.categories) {
        const n = cat.children.reduce((s, ch) => s + ch.items.length, 0);
        const btn = document.createElement("button");
        btn.className = "sub-btn";
        btn.innerHTML = `${cat.name} <span class="badge">${n}</span>`;
        btn.dataset.sub = cat.name;
        subNav.appendChild(btn);
    }
    subNav.addEventListener("click", e => {
        const btn = e.target.closest(".sub-btn");
        if (!btn) return;
        subNav.querySelectorAll(".sub-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentSub = btn.dataset.sub;
        render(topId, currentSub);
    });
}

// ── Render ──
const iconMap = {"文件资料":"📁","影视音漫":"🎬","教程课程":"🎓","游戏资源":"🎮","素材杂烩":"📦"};
const colorMap = {"文件资料":["#b45309","#fdf1e3"],"影视音漫":["#dc2626","#fef2f2"],"教程课程":["#7c3aed","#f5f3ff"],"游戏资源":["#059669","#ecfdf5"],"素材杂烩":["#0284c7","#f0f9ff"]};

function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

function highlight(text, q) {
    if (!q) return esc(text);
    const safe = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const re = new RegExp(`(${safe})`, 'gi');
    return esc(text).replace(re, '<span class="hl">$1</span>');
}

let searchTimer;
const searchInput = document.getElementById("searchInput");
searchInput.addEventListener("input", () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
        const activeTop = topNav.querySelector(".top-btn.active").dataset.top;
        render(activeTop, currentSub);
    }, 150);
});

function render(topId, subId) {
    const main = document.getElementById("main");
    const empty = document.getElementById("empty");
    const q = searchInput.value.trim().toLowerCase();
    main.innerHTML = "";
    let shown = 0;

    const tops = topId === "all" ? Object.entries(DATA) : [[topMeta[topId].key, DATA[topMeta[topId].key]]];

    for (const [tk, tv] of tops) {
        const cats = subId === "all" ? tv.categories : tv.categories.filter(c => c.name === subId);
        for (const cat of cats) {
            // collect matching items across children
            const matchedChildren = [];
            let catTotal = 0;
            for (const child of cat.children) {
                const items = child.items.filter(it => !q || it.title.toLowerCase().includes(q));
                if (items.length) { matchedChildren.push({ ...child, items }); catTotal += items.length; }
            }
            if (!catTotal) continue;

            const sec = document.createElement("div");
            sec.className = "cat-section";
            const [c, bg] = colorMap[tv.title] || ["#b45309","#fdf1e3"];
            sec.innerHTML = `<div class="cat-heading" style="background:${bg}">
                <div class="cat-icon" style="background:${c}15;color:${c}">${iconMap[tv.title]||"📦"}</div>
                <h2 style="color:${c}">${esc(cat.name)}</h2>
                <span class="cat-count">${catTotal}</span>
            </div>`;

            let catIdx = 0;
            for (const child of matchedChildren) {
                // 三级标题（如果该二级下有多个三级）
                if (matchedChildren.length > 1) {
                    sec.innerHTML += `<div class="sub-heading">${esc(child.name)}</div>`;
                }
                const grid = document.createElement("div");
                grid.className = "grid";
                for (const item of child.items) {
                    catIdx++;
                    const a = document.createElement("a");
                    a.className = "item";
                    a.href = item.link;
                    a.target = "_blank";
                    a.innerHTML = `<span class="item-num">${String(item.num || catIdx).padStart(3,'0')}</span>
                        <span class="item-title" title="${esc(item.title)}">${highlight(item.title, q)}</span>
                        ${item.backup ? `<button class="bak-btn" title="备用链接：${esc(item.backup)}" onclick="openBackup(event,'${item.backup}',this)">备</button>` : ""}
                        <span class="item-arrow" aria-hidden="true">→</span>`;
                    grid.appendChild(a);
                }
                sec.appendChild(grid);
            }
            main.appendChild(sec);
            shown += catTotal;
        }
    }
    empty.classList.toggle("show", shown === 0);
}


function openBackup(e, url, btn) {
    e.preventDefault(); e.stopPropagation();
    window.open(url, "_blank", "noopener");
    btn.textContent = "✓"; btn.style.color = "#059669"; btn.style.borderColor = "#059669";
    setTimeout(() => { btn.textContent = "备"; btn.style.color = ""; btn.style.borderColor = ""; }, 1200);
}

// ── Init ──
render(firstTopTitle, "all");
renderSubNav(firstTopTitle);

// 动态同步导航与顶栏高度，避免顶栏/二级导航换行或多出时被下方 sticky 元素遮住
(function syncHeights() {
    const nav = document.querySelector(".top-nav");
    const hdr = document.querySelector(".header");
    if (!nav || !hdr) return;
    const update = () => {
        document.documentElement.style.setProperty("--nav-height", nav.offsetHeight + "px");
        document.documentElement.style.setProperty("--header-height", hdr.offsetHeight + "px");
    };
    update();
    window.addEventListener("resize", update);
    window.addEventListener("load", update);
    if (window.ResizeObserver) {
        new ResizeObserver(update).observe(nav);
        new ResizeObserver(update).observe(hdr);
    }
})();
</script>
